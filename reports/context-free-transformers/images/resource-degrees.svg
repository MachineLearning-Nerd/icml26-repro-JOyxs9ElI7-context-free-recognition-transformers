<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Independently derived padding polynomial degrees</title>
  <desc id="desc">Exact finite differences derive degree six for general context-free languages, degree three for unambiguous languages, and degree two for linear unambiguous languages.</desc>
  <rect width="1120" height="600" rx="28" fill="#f8fafc"/>
  <text x="64" y="70" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Grammatical restrictions remove allocation dimensions</text>
  <text x="64" y="108" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="19">Exact rational finite differences on generated schemas—not fitted slopes</text>
  <line x1="136" y1="490" x2="1030" y2="490" stroke="#94a3b8" stroke-width="2"/>
  <line x1="136" y1="170" x2="136" y2="490" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="end">
    <text x="122" y="496">0</text><text x="122" y="443">1</text><text x="122" y="390">2</text><text x="122" y="337">3</text><text x="122" y="284">4</text><text x="122" y="231">5</text><text x="122" y="178">6</text>
  </g>
  <rect x="225" y="170" width="190" height="320" rx="14" fill="#7c3aed"/>
  <rect x="485" y="330" width="190" height="160" rx="14" fill="#0ea5e9"/>
  <rect x="745" y="383" width="190" height="107" rx="14" fill="#10b981"/>
  <g fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    <text x="320" y="220">6</text><text x="580" y="380">3</text><text x="840" y="433">2</text>
  </g>
  <g fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <text x="320" y="530">General CFL</text><text x="580" y="530">Unambiguous CFL</text><text x="840" y="530">Linear + unambiguous</text>
  </g>
  <g fill="#475569" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">
    <text x="320" y="557">items × slashed items × gap guesses</text>
    <text x="580" y="557">items + candidate edges</text>
    <text x="840" y="557">constant-outdegree edges</text>
  </g>
</svg>
